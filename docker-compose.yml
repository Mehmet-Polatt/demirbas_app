services:
  # 1. MySQL 8.0 Veritabanı
  db:
    image: mysql:8.0
    container_name: it_demirbas_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 156473mP*
      MYSQL_DATABASE: zimmet_db
    ports:
      - "3307:3306" # Bilgisayarındaki yerel 3306 ile çakışmaması için 3307'ye yönlendirildi
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p156473mP*"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. FastAPI Backend Servisi
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: it_demirbas_backend
    restart: always
    command: >
      sh -c "python app/db/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      - PROJECT_NAME=IT Demirbaş ve Zimmet Yönetim Sistemi
      - DATABASE_URL=mysql+pymysql://root:156473mP*@db:3306/zimmet_db
      - SECRET_KEY=super-secret-key-demirbas-jwt-2024-secure-random
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - QR_CODE_DIR=/app/static/qrcodes
    ports:
      - "8000:8000"
    volumes:
      - qr_storage:/app/static/qrcodes
    depends_on:
      db:
        condition: service_healthy

  # 3. Next.js Koyu Arayüz (Frontend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: it_demirbas_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  qr_storage:
